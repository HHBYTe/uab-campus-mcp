name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check scripts/auth.mjs && node --check scripts/check-tokens.mjs && node --check scripts/doctor.mjs && node --check scripts/check-version.mjs
      - run: npm run check:version
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: docker build -t uab-campus-mcp:test .
